name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  install-and-test:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: umbracred-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: umbracred-app/package-lock.json

      - name: Update NPM
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile and test contract
        working-directory: umbracred-app/contract
        run: |
          npm run ci

      - name: Build & test API
        working-directory: umbracred-app/api
        run: |
          npm run ci

      - name: Compile bboard-cli
        working-directory: umbracred-app/bboard-cli
        run: |
          npm run ci

      - name: Typecheck & lint bboard-ui
        working-directory: umbracred-app/bboard-ui
        run: |
          npm run ci

      - name: Verify bboard-ui production build
        working-directory: umbracred-app/bboard-ui
        run: |
          npm run build
